:root{
  --text:#f4f1e6; --dim:#9fb0d2; --gold:#e2bf68; --gold2:#8a6f2e;
  --gain:#7ad493; --loss:#ee6f56; --px:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0f1530}
html,body{margin:0;padding:0}
body{
  color:var(--text); min-height:100vh; min-height:100dvh;
  font-family:'Cubic',-apple-system,'PingFang TC',sans-serif;
  font-size:22px; line-height:1.45;
  -webkit-font-smoothing:none; font-smooth:never;
  padding-bottom:calc(94px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
canvas,img{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-family:'Cubic',sans-serif}
input,select,textarea{font:inherit;font-family:'Cubic',sans-serif}

#bg{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;z-index:-1;overflow:hidden;background:#a5d3e9}
#bg img{position:absolute;left:50%;top:0;transform:translateX(-50%);height:100%;width:auto;min-width:100%}

.win{
  border:12px solid transparent;
  border-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAAW0lEQVR4nGPk4hH7z0ACYGFgYGC4sTmIKMUavusgGhgYGBhmLDmBV3FGjAWEwcUj9v/R/oz/VckGBJ3GxSP2n4kotyCB4aCBBZmDL6QyYixQ4wEezgQAI6lJAwA16hUE6/YV0wAAAABJRU5ErkJggg==) 4 repeat;
  background:linear-gradient(180deg,rgba(38,53,100,.95),rgba(18,26,58,.97));
  background-clip:padding-box; padding:14px 16px; margin-bottom:14px;
}
.hd{font-size:22px;color:var(--gold);letter-spacing:2px;
  border-bottom:var(--px) solid rgba(226,191,104,.3);
  padding-bottom:6px;margin:-2px 0 12px;display:flex;align-items:center}
.hd .l{flex:1;min-width:0}
.hd small{color:var(--dim);font-size:11px;letter-spacing:0;white-space:nowrap}
.hd i{width:16px;height:16px;flex:none;margin-right:7px}
.hd i canvas{width:16px;height:16px}

.top{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:var(--px) solid rgba(226,191,104,.28);
  background:linear-gradient(180deg,rgba(17,24,50,.95),rgba(11,16,34,.86))}
.top b{color:var(--gold);letter-spacing:1px;font-weight:normal;display:flex;align-items:center;gap:8px;
       font-size:22px;white-space:nowrap;overflow:hidden}
.top b canvas{width:32px;height:32px;flex:none}
#sync{font-size:11px;color:var(--dim);padding:5px 9px;border:var(--px) solid #3b4874;
      background:rgba(11,14,28,.6);white-space:nowrap;flex:none}
#sync.busy{color:var(--gold);border-color:var(--gold2)}
#sync.bad{color:var(--loss);border-color:#7a3328}
#sync.pend{color:#f0c14a;border-color:#7a6330}
#gear{font-size:20px;color:var(--dim);padding:2px 4px;flex:none;line-height:1}

main{max-width:520px;margin:0 auto;padding:14px 12px 0;min-height:calc(100vh - 150px);min-height:calc(100dvh - 150px)}
.scr{display:none}.scr.on{display:block}

.mem{display:flex;gap:12px;align-items:center;padding:10px 0}
.mem+.mem{border-top:var(--px) dashed rgba(159,176,210,.28)}
.face{width:68px;height:68px;flex:none;padding:2px;background:#0d1020;
      box-shadow:0 0 0 var(--px) var(--gold2), inset 0 0 0 var(--px) #000}
.face canvas{width:64px;height:64px}
.mem .info{flex:1;min-width:0}
.mem .nm{font-size:22px;line-height:1.2}
.mem .job{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
.mem .cls{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:5px}
.mem .cls canvas{width:16px;height:16px}
.mem .val{font-size:22px;text-align:right;white-space:nowrap}
.bar{height:8px;background:#0b0e1c;box-shadow:inset 0 0 0 var(--px) #000;margin-top:5px;position:relative}
.bar i{position:absolute;inset:var(--px);width:var(--w,0%);background:var(--gain);display:block}
.bar.dn i{background:var(--loss)}

.enc{text-align:center;padding:6px 0 2px}
.enc .icon{width:112px;height:112px;margin:6px auto 10px}
.enc .icon canvas{width:112px;height:112px}
.enc .name{font-size:33px;color:var(--gold);letter-spacing:2px;line-height:1.2;min-height:44px}
.enc .sub{color:var(--dim);font-size:11px;margin-top:6px;min-height:18px}
.talk{min-height:66px}
.talk .cur{color:var(--gold);animation:bl .7s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

.btn{display:block;width:100%;text-align:center;padding:11px 8px;margin-top:8px;
  border:8px solid transparent;
  border-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAJCAYAAADgkQYQAAAAQklEQVR4nGPk4hH7z0AAsDAwMDC0Tj+OU0F1piVEEQMDA0NhrDIjuoL+xXf/MzAwMDARsmoAFMEdDnMkNsBITDgBAGakDHs6Oqi/AAAAAElFTkSuQmCC) 3 repeat;
  background:linear-gradient(180deg,#3d4f8c,#26325c);background-clip:padding-box;letter-spacing:2px}
.btn:active{background:linear-gradient(180deg,#26325c,#3d4f8c)}
.btn.gold{background:linear-gradient(180deg,#c9a44e,#8a6f2e);background-clip:padding-box;color:#1a1508}
.btn.gold:active{background:linear-gradient(180deg,#8a6f2e,#c9a44e)}
.btn[disabled]{opacity:.45}
.btn.sm{font-size:11px;padding:8px;letter-spacing:1px}
.row{display:flex;gap:8px}

.field{margin-bottom:12px}
.lbl{color:var(--dim);font-size:11px;margin-bottom:4px;letter-spacing:1px}
.inp{width:100%;padding:8px 10px;background:#0b0e1c;color:var(--text);
     border:var(--px) solid #46538a;outline:none;-webkit-appearance:none;border-radius:0;font-size:22px}
.inp:focus{border-color:var(--gold)}
.inp.s{font-size:16px}
.shoprow{display:flex;gap:8px;align-items:stretch}
.badge{width:52px;flex:none;background:#0b0e1c;border:var(--px) solid #46538a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.badge canvas{width:32px;height:32px}
.badge .k{font-size:11px;color:var(--gold);line-height:1}
.pick{display:flex;gap:8px}
.pick button{flex:1;padding:6px 2px;background:#141b36;border:var(--px) solid #364268;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pick button[aria-pressed=true]{border-color:var(--gold);background:#26315a}
.pick canvas{width:32px;height:32px}
.pick .t{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.amt{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.amt .who{width:32px;height:32px;flex:none}
.amt .who canvas{width:32px;height:32px}
.amt .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt .inp{width:104px;flex:none;text-align:right}

.mask{position:fixed;inset:0;z-index:60;display:none;background:rgba(6,9,20,.84);
      align-items:center;justify-content:center;padding:14px}
.mask.on{display:flex}
.mask .win{max-width:440px;width:100%;margin:0;max-height:86vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button{padding:6px 2px;background:#141b36;border:var(--px) solid #364268;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.grid button[aria-pressed=true]{border-color:var(--gold);background:#2d3a68}
.grid canvas{width:32px;height:32px}
.grid .t{font-size:11px;color:var(--dim)}
.grid button[aria-pressed=true] .t{color:var(--gold)}

.e{display:flex;align-items:center;gap:9px;padding:8px 0;width:100%;text-align:left}
.e+.e{border-top:var(--px) dashed rgba(159,176,210,.22)}
.e canvas{width:24px;height:24px;flex:none}
.e .t{flex:1;min-width:0}
.e .t .s1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e .t .s2{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e .a{font-size:11px;color:var(--dim);white-space:nowrap;text-align:right}
.e .a b{display:block;font-size:22px;color:var(--text);font-weight:normal}

.pay{display:flex;align-items:center;gap:8px;padding:10px 0}
.pay+.pay{border-top:var(--px) dashed rgba(159,176,210,.28)}
.pay .col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;width:56px}
.pay .col canvas{width:48px;height:48px}
.pay .col .nm{font-size:11px;color:var(--dim);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .ar{color:var(--gold);flex:1;text-align:center;letter-spacing:2px}
.pay .v{color:var(--loss);white-space:nowrap}
.log{color:var(--dim);line-height:1.7}
.log b{color:var(--text);font-weight:normal}
.log .g{color:var(--gain)}.log .r{color:var(--loss)}
.zero{text-align:center;color:var(--dim);font-size:11px;padding:16px 0;line-height:2}

.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;padding:8px;background:rgba(20,27,54,.9);border:var(--px) solid #364268;text-align:center}
.seg button[aria-pressed=true]{border-color:var(--gold);background:#2d3a68;color:var(--gold)}
.chart{display:flex;align-items:flex-end;gap:5px;height:126px;padding:0 2px;margin:4px 0 6px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .b{width:100%;background:linear-gradient(180deg,#7fa9e0,#3d5da8);
          box-shadow:inset 0 0 0 var(--px) #0b0e1c;min-height:2px}
.chart .col.now .b{background:linear-gradient(180deg,#e8c96a,#b58a2a)}
.chart .v{font-size:11px;color:var(--dim);margin-bottom:3px}
.chart .x{font-size:11px;color:var(--dim);margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
    border-bottom:var(--px) dashed rgba(159,176,210,.25)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim);flex:none}
.kv span:last-child{font-size:11px;text-align:right}
.rank{display:flex;align-items:center;gap:9px;padding:7px 0}
.rank+.rank{border-top:var(--px) dashed rgba(159,176,210,.25)}
.rank canvas{width:32px;height:32px;flex:none}
.rank .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .c{color:var(--gold);font-size:11px}
.calhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhd button{padding:4px 14px;background:#141b36;border:var(--px) solid #364268}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{font-size:11px;color:var(--dim);text-align:center;padding-bottom:2px}
.cal .d{aspect-ratio:1;background:#141b36;border:var(--px) solid #2a3358;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:1px}
.cal .d.off{background:transparent;border-color:transparent}
.cal .d.has{border-color:#4a5a90}
.cal .d.today{border-color:var(--gold)}
.cal .d .n{font-size:11px;color:var(--dim);line-height:1}
.cal .d .ic{display:flex;gap:1px}
.cal .d .ic canvas{width:14px;height:14px}
.cal .d .v{font-size:11px;color:var(--gold);line-height:1}
.cal .d .more{font-size:11px;color:var(--dim);line-height:1}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;
  background:linear-gradient(180deg,#161d3a,#0b0e1c);
  border-top:var(--px) solid var(--gold2);padding-bottom:env(safe-area-inset-bottom)}
nav::after{content:'';position:absolute;left:0;right:0;top:100%;height:160px;background:#0b0e1c}
nav button{flex:1;color:var(--dim);display:flex;flex-direction:column;align-items:center;
  gap:2px;font-size:11px;padding:7px 0 6px}
nav button[aria-pressed=true]{color:var(--gold)}
nav button canvas{width:32px;height:32px;opacity:.6}
nav button[aria-pressed=true] canvas{opacity:1}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(12px);
  bottom:calc(108px + env(safe-area-inset-bottom));background:#0b0e1c;color:var(--text);
  padding:9px 16px;font-size:11px;border:var(--px) solid var(--gold2);
  opacity:0;transition:.2s;pointer-events:none;z-index:80;max-width:84%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.note{color:#eef2fd;font-size:11px;line-height:1.9;margin:2px 0 14px;padding:7px 9px;
      background:rgba(9,12,26,.76);border:var(--px) solid rgba(226,191,104,.4)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="top">
  <b><canvas id="crest"></canvas><span>午餐選困互助會</span></b>
  <button id="sync">未設定</button><button id="gear" title="設定">⚙</button>
</div>

<main>

<!-- ============ 初次設定 ============ -->
<section class="scr" id="s-setup">
  <div class="win">
    <div class="hd" data-ic="book"><span class="l">加入公會</span></div>
    <div class="field">
      <div class="lbl">API 網址（Apps Script 部署後的 /exec）</div>
      <input class="inp s" id="setUrl" placeholder="https://script.google.com/macros/s/..../exec" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <div class="lbl">通關密語（要和 Code.gs 裡的 SECRET 一樣）</div>
      <input class="inp s" id="setKey" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <button class="btn gold" id="setGo">連線</button>
  </div>
  <div class="win" id="whoBox" style="display:none">
    <div class="hd" data-ic="party"><span class="l">你是誰</span></div>
    <div class="pick" id="whoPick"></div>
    <button class="btn gold" id="whoGo">就是我</button>
  </div>
</section>

<!-- ============ 隊伍 ============ -->
<section class="scr" id="s-party">
  <div class="win">
    <div class="hd" data-ic="shield"><span class="l">隊伍狀態</span><small id="pdRange"></small></div>
    <div id="party"></div>
  </div>
  <div class="win">
    <div class="hd" data-ic="scroll"><span class="l">冒險日誌</span><small id="logCnt"></small></div>
    <div id="logs"></div>
  </div>
</section>

<!-- ============ 遭遇 ============ -->
<section class="scr" id="s-enc">
  <div class="win">
    <div class="enc">
      <div class="icon"><canvas id="encIcon" width="16" height="16"></canvas></div>
      <div class="name" id="encName">？？？</div>
      <div class="sub" id="encSub">按下面按鈕</div>
    </div>
  </div>
  <div class="win"><div class="talk" id="talk"></div></div>
  <button class="btn gold" id="btnRoll">遭遇一家店</button>
  <div class="row">
    <button class="btn" id="btnOk">就這家</button>
    <button class="btn" id="btnNo">再抽一次</button>
  </div>
  <div class="win" style="margin-top:14px">
    <div class="hd" data-ic="bowl"><span class="l">口袋名單</span><small id="shopCnt"></small></div>
    <div class="shoprow" style="margin-bottom:8px">
      <input class="inp" id="newShop" placeholder="新增店家" enterkeyhint="done">
      <button class="btn sm" id="addShop" style="width:74px;margin:0;flex:none">加入</button>
    </div>
    <div id="shops"></div>
  </div>
</section>

<!-- ============ 記錄 ============ -->
<section class="scr" id="s-log">
  <div class="win">
    <div class="hd" data-ic="quill"><span class="l" id="formTitle">記錄戰果</span><small id="byWho"></small></div>
    <div class="field">
      <div class="lbl">日期</div>
      <input class="inp" type="date" id="fDate">
    </div>
    <div class="field">
      <div class="lbl">店家 <span id="guessLbl" style="color:var(--gold)"></span></div>
      <div class="shoprow">
        <button class="badge" id="badge"><span class="k">改</span></button>
        <input class="inp" id="shop" list="shoplist" placeholder="吃哪家">
        <datalist id="shoplist"></datalist>
      </div>
    </div>
    <div class="field">
      <div class="lbl">誰先付的</div>
      <div class="pick" id="payer"></div>
    </div>
    <div class="field">
      <div class="lbl">各自多少（沒吃留空）</div>
      <div id="amts"></div>
      <div class="row" style="margin-top:8px">
        <input class="inp" id="fTotal" inputmode="numeric" placeholder="總額" style="text-align:right">
        <button class="btn sm" id="btnSplit" style="width:88px;margin:0;flex:none">均分</button>
        <button class="btn sm" id="btnClear" style="width:74px;margin:0;flex:none">清空</button>
      </div>
    </div>
    <button class="btn gold" id="btnSave">寫入公會帳簿</button>
    <div class="row" id="editRow" style="display:none">
      <button class="btn sm" id="btnCancel" style="flex:1">取消編輯</button>
      <button class="btn sm" id="btnDel" style="flex:1;color:var(--loss)">刪掉這一筆</button>
    </div>
  </div>
</section>

<!-- ============ 清算 ============ -->
<section class="scr" id="s-settle">
  <div class="win">
    <div class="hd" data-ic="coin"><span class="l">清算</span><small id="stRange"></small></div>
    <div id="pays"></div>
  </div>
  <div class="win">
    <div class="hd" data-ic="scroll"><span class="l">明細</span></div>
    <div class="log" id="detail"></div>
  </div>
  <button class="btn gold" id="btnCopy">複製戰報，貼到 LINE</button>
  <button class="btn" id="btnClose">收到錢了，關帳</button>
  <div class="win" style="margin-top:14px">
    <div class="hd" data-ic="book"><span class="l">關帳紀錄</span></div>
    <div id="periods"></div>
  </div>
</section>

<!-- ============ 統計 ============ -->
<section class="scr" id="s-stat">
  <div class="seg" id="statSeg">
    <button data-v="week" aria-pressed="true">近 8 週</button>
    <button data-v="month" aria-pressed="false">月曆</button>
  </div>
  <div id="statWeek">
    <div class="win">
      <div class="hd" data-ic="chart"><span class="l">每週花費</span><small>全隊合計</small></div>
      <div class="chart" id="chart"></div>
    </div>
    <div class="win">
      <div class="hd" data-ic="chart"><span class="l">數字</span><small>近 8 週</small></div>
      <div id="kvs"></div>
    </div>
    <div class="win">
      <div class="hd" data-ic="bowl"><span class="l">常去排行</span></div>
      <div id="rank"></div>
    </div>
  </div>
  <div id="statMonth" style="display:none">
    <div class="win">
      <div class="calhd">
        <button id="mPrev">◀</button>
        <div id="mTitle" style="color:var(--gold)"></div>
        <button id="mNext">▶</button>
      </div>
      <div class="cal" id="cal"></div>
    </div>
    <div class="win">
      <div class="hd" data-ic="chart"><span class="l">本月</span><small id="mSub"></small></div>
      <div id="mkvs"></div>
    </div>
  </div>
</section>

</main>

<!-- ============ 彈窗 ============ -->
<div class="mask" id="mIcons"><div class="win">
  <div class="hd" data-ic="book"><span class="l">圖鑑</span><small>24 種</small></div>
  <div class="grid" id="icons"></div>
  <button class="btn" data-close>關閉</button>
</div></div>

<div class="mask" id="mDay"><div class="win">
  <div class="hd" data-ic="cal"><span class="l" id="dayTitle"></span></div>
  <div id="dayList"></div>
  <button class="btn" data-close>關閉</button>
</div></div>

<div class="mask" id="mSet"><div class="win">
  <div class="hd" data-ic="party"><span class="l">設定</span></div>
  <div class="field">
    <div class="lbl">我是誰</div>
    <div class="pick" id="mePick"></div>
  </div>
  <div class="field">
    <div class="lbl">隊員名字（改了三個人都會同步）</div>
    <div id="nameEdit"></div>
  </div>
  <div class="field">
    <div class="lbl">抽籤避開幾天內吃過的</div>
    <select class="inp" id="cool">
      <option value="0">不避開</option><option value="3">3 天</option>
      <option value="5">5 天</option><option value="7">7 天</option><option value="10">10 天</option>
    </select>
  </div>
  <div class="field">
    <div class="lbl">API 網址</div>
    <input class="inp s" id="cfgUrl" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="lbl" style="margin-top:8px">通關密語</div>
    <input class="inp s" id="cfgKey" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
  <button class="btn gold" id="setSave">儲存並同步</button>
  <button class="btn sm" id="btnExport">匯出備份 JSON</button>
  <button class="btn" data-close>關閉</button>
</div></div>

<nav id="nav"></nav>

function draw(cv, rows, pal) {
  const h = rows.length, w = rows[0].length;
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    const c = Array.isArray(pal) ? pal[+ch] : pal[ch]; if (!c) continue;
    g.fillStyle = c; g.fillRect(x, y, 1, 1);
  }
  return cv;
}
function pxc(kind, key, size) {
  const cv = document.createElement('canvas');
  if (kind === 'p') draw(cv, PORTRAIT[key] || PORTRAIT.yulun, PPAL[key] || PPAL.yulun);
  else if (kind === 'f') draw(cv, FOOD[key] || FOOD.bento, FPAL[key] || FPAL.bento);
  else draw(cv, ICON[key], UGOLD);
  cv.style.width = size + 'px'; cv.style.height = size + 'px';
  return cv;
}
function uic(k, size, pal) {

/* ================= 同步 ================= */
let syncing = false, retry = false;
function setSync(cls, txt) { const b = $('sync'); b.className = cls; b.textContent = txt; }
function syncLabel() {
  if (!S.cfg.url) return setSync('bad', '未設定');
  if (syncing) return setSync('busy', '同步中');
  if (S.outbox.length) return setSync('pend', '未送出 ' + S.outbox.length);
  if (!S.lastSync) return setSync('bad', '尚未同步');
  const d = new Date(S.lastSync);
  setSync('', '已同步 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
}

async function api(body) {
  const u = S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(S.cfg.key);
  const opt = body
    ? { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' }
    : { method: 'GET', redirect: 'follow' };
  const r = await fetch(u, opt);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '伺服器回錯誤');
  return j;
}
function upsert(list, row) {
  const i = list.findIndex(x => x.id === row.id);
  if (i < 0) { list.push(row); return; }
  if ((+row.updatedAt || 0) >= (+list[i].updatedAt || 0)) list[i] = row;
}
function mergeAll(j) {
  ['members', 'shops', 'entries', 'periods'].forEach(k => {
    if (!Array.isArray(j[k])) return;
    j[k].forEach(row => upsert(S[k], row));
  });
  if (S.members.length > 3) S.members = S.members.slice(0, 3);
}
async function sync(quiet) {
  if (!S.cfg.url) return;
  if (syncing) { retry = true; return; }
  syncing = true; syncLabel();
  const sending = S.outbox.slice();            // 只清掉這一批，送出期間新增的要留著
  try {
    const body = sending.length ? { members: [], shops: [], entries: [], periods: [] } : null;
    if (body) sending.forEach(o => body[o.t].push(o.row));
    const j = await api(body);
    S.outbox = S.outbox.filter(o => !sending.some(x =>
      x.t === o.t && x.row.id === o.row.id && x.row.updatedAt === o.row.updatedAt));
    mergeAll(j);
    S.lastSync = Date.now(); save(); render();
    if (!quiet) toast('同步完成');
  } catch (e) {
    syncing = false; setSync('bad', '同步失敗');
    if (!quiet) toast('同步失敗：' + e.message);
    return;
  }
  syncing = false; syncLabel();
  if (S.outbox.length || retry) { retry = false; setTimeout(() => sync(true), 500); }
}
function putMany(coll, rows) {
  const ts = Date.now();
  rows.forEach(row => {
    row.updatedAt = ts; if (!row.deleted) row.deleted = 0;
    upsert(S[coll], row);
    S.outbox = S.outbox.filter(o => !(o.t === coll && o.row.id === row.id));
    S.outbox.push({ t: coll, row });
  });
  save(); render(); sync(true);
}
function put(coll, row) {
  row.updatedAt = Date.now();
  if (!row.deleted) row.deleted = 0;
  upsert(S[coll], row);
  S.outbox = S.outbox.filter(o => !(o.t === coll && o.row.id === row.id));
  S.outbox.push({ t: coll, row });
  save(); render(); sync(true);
}

/* ================= 分帳計算 ================= */
function nets(list) {
  const n = [0, 0, 0];
  list.forEach(e => {
    const tot = eTotal(e);
    n[mIdx(e.payer)] += tot;
    AK.forEach((k, i) => n[i] -= (+e[k] || 0));
  });
  return n.map(Math.round);
}
function transfers(n) {
  const cr = n.map((v, i) => ({ i, v })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const de = n.map((v, i) => ({ i, v: -v })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const out = []; let a = 0, b = 0;
  while (a < cr.length && b < de.length) {
    const m = Math.min(cr[a].v, de[b].v);
    if (m > 0) out.push({ from: de[b].i, to: cr[a].i, amt: m });
    cr[a].v -= m; de[b].v -= m;
    if (cr[a].v <= 0) a++; if (de[b].v <= 0) b++;
  }
  return out;
}

}

/* ================= 清算 ================= */
function report() {
  const list = openEntries(); if (!list.length) return '';
  const n = nets(list), tr = transfers(n), ds = list.map(e => e.date).sort();
  const head = '🍱 午餐清算 ' + md(ds[0]) + '–' + md(ds[ds.length - 1]) + '（' + list.length + ' 筆）';
  const body = M().map((m, i) => {
    const paid = list.filter(e => e.payer === m.id).reduce((s, e) => s + eTotal(e), 0);
    const ate = list.reduce((s, e) => s + (+e[AK[i]] || 0), 0);
    return m.name + '　墊 ' + nt(paid) + '　吃 ' + nt(ate);
  }).join('\n');
  const t = tr.length ? tr.map(x => '➡️ ' + M()[x.from].name + ' 給 ' + M()[x.to].name + ' ' + nt(x.amt)).join('\n') : '✅ 剛好打平';
  return head + '\n' + body + '\n\n' + t;
}
$('btnCopy').onclick = async () => {

  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('複製好了');

const monday = d => { const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return new Date(x - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
let calY, calM;
(function () { const d = new Date(); calY = d.getFullYear(); calM = d.getMonth(); })();
$('mPrev').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); };
$('mNext').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); };
$('statSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
  $('statSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('statWeek').style.display = b.dataset.v === 'week' ? '' : 'none';
  $('statMonth').style.display = b.dataset.v === 'month' ? '' : 'none';
});
function renderCal() {
  $('mTitle').textContent = calY + ' 年 ' + (calM + 1) + ' 月';
  const c = $('cal'); c.innerHTML = '';
  ['日', '一', '二', '三', '四', '五', '六'].forEach(t => {
    const d = document.createElement('div'); d.className = 'dow'; d.textContent = t; c.appendChild(d);
  });
  const first = new Date(calY, calM, 1).getDay();
  const days = new Date(calY, calM + 1, 0).getDate();
  const byDay = {};
  alive(S.entries).forEach(e => {
    const [y, m] = e.date.split('-').map(Number);
    if (y === calY && m === calM + 1) { const dd = +e.date.slice(8); (byDay[dd] = byDay[dd] || []).push(e); }
  });
  for (let i = 0; i < first; i++) { const d = document.createElement('div'); d.className = 'd off'; c.appendChild(d); }
  const td = today();
  for (let n = 1; n <= days; n++) {
    const iso = calY + '-' + String(calM + 1).padStart(2, '0') + '-' + String(n).padStart(2, '0');
    const d = document.createElement('div'); d.className = 'd' + (byDay[n] ? ' has' : '') + (iso === td ? ' today' : '');
    const nn = document.createElement('div'); nn.className = 'n'; nn.textContent = n; d.appendChild(nn);
    if (byDay[n]) {
      const ic = document.createElement('div'); ic.className = 'ic';
      byDay[n].slice(0, 2).forEach(e => ic.appendChild(pxc('f', e.icon || 'bento', 14)));
      d.appendChild(ic);
      const sum = byDay[n].reduce((s, e) => s + eTotal(e), 0);
      const v = document.createElement('div'); v.className = 'v'; v.textContent = sum; d.appendChild(v);
      if (byDay[n].length > 2) { const m2 = document.createElement('div'); m2.className = 'more'; m2.textContent = '+' + (byDay[n].length - 2); d.appendChild(m2); }
      d.onclick = () => openDay(iso, byDay[n]);
    }
    c.appendChild(d);
  }
  const all = Object.values(byDay).flat();
  const tot = all.reduce((s, e) => s + eTotal(e), 0);
  const shopCount = {}; all.forEach(e => shopCount[e.shop] = (shopCount[e.shop] || 0) + 1);
  const top = Object.entries(shopCount).sort((a, b) => b[1] - a[1])[0];
  const mx2 = all.slice().sort((a, b) => eTotal(b) - eTotal(a))[0];
  $('mSub').textContent = (calM + 1) + ' 月';
  $('mkvs').innerHTML = '';
  [['本月總計', all.length ? nt(tot) + ' 元' : '—'],
   ['吃了幾餐', all.length + ' 餐'],
   ['每人本月', all.length ? nt(tot / 3) + ' 元' : '—'],
   ['每人每餐', all.length ? nt(tot / all.length / 3) + ' 元' : '—'],
   ['最貴的一天', mx2 ? md(mx2.date) + ' ' + mx2.shop + ' ' + nt(eTotal(mx2)) : '—'],
   ['最常吃', top ? top[0] + ' ' + top[1] + ' 次' : '—']].forEach(([k, v]) => {
    const d = document.createElement('div'); d.className = 'kv';
    d.innerHTML = '<span class="k">' + esc(k) + '</span><span>' + esc(v) + '</span>';
    $('mkvs').appendChild(d);
  });
}
function openDay(iso, list) {
  $('dayTitle').textContent = md(iso) + '　' + list.length + ' 筆';
  const box = $('dayList'); box.innerHTML = '';
  list.forEach(e => box.appendChild(entryEl(e)));

/* ================= 主要渲染 ================= */
function render() {
  syncLabel();
  $('shoplist').innerHTML = alive(S.shops).map(s => '<option value="' + esc(s.name) + '">').join('');

  const list = openEntries();
  const n = nets(list), mx = Math.max(1, ...n.map(Math.abs));
  const ds = list.map(e => e.date).sort();

  // 隊伍
  $('pdRange').textContent = list.length ? md(ds[0]) + '–' + md(ds[ds.length - 1]) : '本期還沒紀錄';
  const p = $('party'); p.innerHTML = '';
  M().forEach((m, i) => {
    const d = document.createElement('div'); d.className = 'mem';
    const f = document.createElement('div'); f.className = 'face'; f.appendChild(pxc('p', m.portrait, 64));

    const v = document.createElement('div'); v.className = 'val';
    v.innerHTML = '<span style="color:var(--' + (n[i] >= 0 ? 'gain' : 'loss') + ')">' + (n[i] > 0 ? '+' : '') + nt(n[i]) + '</span>';
    d.append(f, info, v); p.appendChild(d);
  });

  // 日誌
  $('logCnt').textContent = list.length ? list.length + ' 筆' : '';

  // 口袋名單
  const rec = lastEaten(), shops = alive(S.shops).slice()
    .sort((a, b) => (rec[b.name] == null ? 9e3 : rec[b.name]) - (rec[a.name] == null ? 9e3 : rec[a.name]));

  // 清算

  else if (!tr.length) pays.innerHTML = '<div class="zero">剛好打平，誰也不欠誰。</div>';
  else tr.forEach(x => {
    const d = document.createElement('div'); d.className = 'pay';
    const col = i => {
      const c = document.createElement('div'); c.className = 'col';
      c.appendChild(pxc('p', M()[i].portrait, 48));

      c.appendChild(nm); return c;
    };
    const ar = document.createElement('div'); ar.className = 'ar'; ar.textContent = '───▶';

  });
  $('detail').innerHTML = M().map((m, i) => {
    const paid = list.filter(e => e.payer === m.id).reduce((s, e) => s + eTotal(e), 0);

  }).join('');
  $('btnClose').disabled = !list.length;

  // 關帳紀錄
  const pd = alive(S.periods).slice().sort((a, b) => a.closedOn < b.closedOn ? 1 : -1);
  const pb = $('periods'); pb.innerHTML = '';
  if (!pd.length) pb.innerHTML = '<div class="zero">還沒關過帳。</div>';
  pd.forEach(x => {
    let info = {}; try { info = JSON.parse(x.transfers || '{}'); } catch (e) { }

    d.append(t, a); pb.appendChild(d);
  });

  // 統計：週
  const all = alive(S.entries);
  const wk = {};
  all.forEach(e => { const k = monday(e.date); wk[k] = (wk[k] || 0) + eTotal(e); });
  const weeks = [];
  const base = monday(today());
  for (let i = 7; i >= 0; i--) {
    const d = new Date(base); d.setDate(d.getDate() - i * 7);
    const k = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

  const meals = all.filter(e => weeks.some(w => monday(e.date) === w[0])).length;
  $('kvs').innerHTML = '';
  [['每週平均', active ? nt(wsum / active) + ' 元' : '—'],
   ['每人每週', active ? nt(wsum / active / 3) + ' 元' : '—'],
   ['每人每餐', meals ? nt(wsum / meals / 3) + ' 元' : '—'],
   ['近 8 週合計', nt(wsum) + ' 元'],
   ['總共記錄', all.length + ' 餐']].forEach(([k, v]) => {
    const d = document.createElement('div'); d.className = 'kv';
    d.innerHTML = '<span class="k">' + esc(k) + '</span><span>' + esc(v) + '</span>'; $('kvs').appendChild(d);
  });
  const cnt = {};
  all.forEach(e => { const key = e.shop || '?'; (cnt[key] = cnt[key] || { c: 0, icon: e.icon }).c++; });
  const rk = $('rank'); rk.innerHTML = '';
  const top = Object.entries(cnt).sort((a, b) => b[1].c - a[1].c).slice(0, 5);
  if (!top.length) rk.innerHTML = '<div class="zero">還沒有資料。</div>';
  top.forEach(([nm2, o]) => {
    const d = document.createElement('div'); d.className = 'rank';
    d.appendChild(pxc('f', o.icon || 'bento', 32));
    const nn = document.createElement('div'); nn.className = 'n'; nn.textContent = nm2;
    const cc = document.createElement('div'); cc.className = 'c'; cc.textContent = o.c + ' 次';
    d.append(nn, cc); rk.appendChild(d);
  });
  renderCal();
}

/* ================= 啟動 ================= */
buildForm(); resetForm();
if (!S.cfg.url || !S.me) { go('setup'); if (S.cfg.url) { $('setUrl').value = S.cfg.url; $('setKey').value = S.cfg.key; $('whoBox').style.display = ''; buildWho(); } }
else go('party');
render();
if (S.cfg.url && S.me) sync(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.cfg.url && S.me) sync(true); });
window.addEventListener('online', () => sync(true));
</script>
</body>
